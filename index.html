<title>송석리 발표 슬라이드</title>

<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg: #fff; --ink: #16161a; --sub: #6b6b76; --line: #e6e6ec; --accent: #6B46FF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0f12; --ink: #f2f2f5; --sub: #9a9aa6; --line: #26262e; --accent: #9d86ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard Variable', Pretendard, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 72px 16px 96px; }
  h1 { margin: 0 0 40px; font-size: 32px; font-weight: 800; letter-spacing: -.02em; }
  ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li a { display: grid; grid-template-columns: 112px 1fr; gap: 4px 20px; padding: 22px 4px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
  li a:hover h2 { color: var(--accent); }
  time { grid-row: span 2; color: var(--sub); font-size: 15px; font-variant-numeric: tabular-nums; padding-top: 3px; }
  h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  p { margin: 0; color: var(--sub); font-size: 15px; }
  @media (max-width: 520px) { li a { grid-template-columns: 1fr; } time { grid-row: auto; } }
</style>
</head>
<body>
<main>

    <li><a href="interview-2026/"><time datetime="2026-10-28">2026. 10. 28.</time><h2>당곡 AI 모의 면접</h2><p>사례 공유 · 대입 면접 연습</p></a></li>
    <li><a href="aileader-2026/"><time datetime="2026-10-29">2026. 10. 29.</time><h2>바이브코딩 사례 나눔과 아이데이션 해커톤</h2><p>동작관악 AI에듀테크 선도교사단 1일차</p></a></li>
    <li><a href="sejong-2026/"><time datetime="2026-09-23">2026. 9. 23.</time><h2>AI 시대의 지피지기</h2><p>세종과학고등학교 특강</p></a></li>
  </ol>
</main>
</body>
</html>
